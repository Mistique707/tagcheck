name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the oldest release with node:sqlite built in; 24 is what we run.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Rebuild icons and check they are current
        run: |
          npm run icons
          git diff --exit-code web/icons

      - name: Boot the server and hit it
        env:
          JOIN_CODE: CIJOIN
          JWT_SECRET: ci-secret
          DB_FILE: data/ci.db
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:3000/ > /dev/null
          curl -sf http://127.0.0.1:3000/shared/plate.js > /dev/null

  # In the serverless setup these rules are the only thing standing between a
  # phone and the club records, so they are tested against the real emulator
  # rather than reviewed by eye.
  rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Test Firestore security rules
        run: npm run test:rules
