name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the oldest release with node:sqlite built in; 24 is what we run.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Rebuild icons and check they are current
        run: |
          npm run icons
          git diff --exit-code web/icons

      - name: Boot the server and hit it
        env:
          JOIN_CODE: CIJOIN
          JWT_SECRET: ci-secret
          DB_FILE: data/ci.db
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:3000/ > /dev/null
          curl -sf http://127.0.0.1:3000/shared/plate.js > /dev/null
